name: 3. Process Pluto World

on:
  schedule:
    - cron: "0 */6 * * *" # Cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Editar PlutoTV + header
        run: |
          # 1. Fecha actual para el header
          FECHA=$(date +"%Y-%m-%d %H:%M:%S")

          # 2. Lista de archivos que descargó el otro workflow
          ARCHIVOS=("plutotv_all.m3u" "plutotv_mx.m3u" "plutotv_us.m3u")

          for archivo in "${ARCHIVOS[@]}"; do
            ruta_origen="sync-m3u/$archivo"

            if [ -f "$ruta_origen" ]; then
              echo "Procesando $archivo..."

              # Definimos el nombre del archivo final en la raíz
              if [ "$archivo" = "plutotv_all.m3u" ]; then nombre_final="PlutoTV-World.m3u"; fi
              if [ "$archivo" = "plutotv_mx.m3u" ]; then nombre_final="PlutoTV-Mx.m3u"; fi
              if [ "$archivo" = "plutotv_us.m3u" ]; then nombre_final="PlutoTV-Us.m3u"; fi

              # 3. Armar los comentarios informativos del Header
              cat <<EOF > header_temp.txt
              #=================================
              # 🖥 Developed by: v0ltax
              # 🎯 This repository does NOT host any content.
              # 🔗 M3U8: https://github.com/abusaeeidx/IPTV-Scraper-Zilla
              # 🔗 EPG: https://github.com/matthuisman/i.mjh.nz
              # 🕒 Last Updated: $FECHA
              #==================================
              EOF

              # 4. Pegar comentarios + el archivo original ENTERO (sin borrar nada)
              cat header_temp.txt > temp.m3u
              cat "$ruta_origen" >> temp.m3u
              
              # 5. Mover a la raíz y limpiar temporales
              mv temp.m3u "./$nombre_final"
              rm header_temp.txt
              echo "✓ Creado: $nombre_final"
            else
              echo "⚠️ No se encontró $ruta_origen en sync-m3u."
            fi
          done

      - name: Commit y Push
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          
          # Agregamos los tres archivos modificados de la raíz
          git add PlutoTV-World.m3u PlutoTV-Mx.m3u PlutoTV-Us.m3u 2>/dev/null || true
          
          # Commit si cambió algo
          git diff --cached --quiet || (git commit -m "Update: Pluto TV lists con fecha" && git push)
