name: 3. Process Pluto World

on:
  schedule:
    - cron: "0 */6 * * *" # Cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      # ==========================================
      # 1. PROCESAR PLUTO ALL -> RAÍZ
      # ==========================================
      - name: Editar plutotv_all + header
        run: |
          if [ -f "sync-m3u/plutotv_all.m3u" ]; then
            echo "Archivo plutotv_all encontrado. Procesando..."
            
            # Fecha actual
            FECHA=$(date +"%Y-%m-%d %H:%M:%S")
          
            # Armar el Header de forma segura sin EOF
            printf "#=================================\n# 🖥 Developed by: v0ltax\n# 🎯 This repository does NOT host any content.\n# 🔗 M3U8: https://github.com/abusaeeidx/IPTV-Scraper-Zilla\n# 🔗 EPG: https://github.com/matthuisman/i.mjh.nz\n# 🕒 Last Updated: %s\n#==================================\n" "$FECHA" > header_temp.txt
          
            # Pegar Header + Contenido Completo del original directo a la raíz
            cat header_temp.txt > plutotv_all.m3u
            cat "sync-m3u/plutotv_all.m3u" >> plutotv_all.m3u
            
            # Limpiar temporal
            rm header_temp.txt
          else
            echo "⚠️ No se encontró sync-m3u/plutotv_all.m3u."
          fi

      # ==========================================
      # 2. PROCESAR PLUTO MX -> RAÍZ
      # ==========================================
      - name: Editar plutotv_mx + header
        run: |
          if [ -f "sync-m3u/plutotv_mx.m3u" ]; then
            echo "Archivo plutotv_mx encontrado. Procesando..."
            
            FECHA=$(date +"%Y-%m-%d %H:%M:%S")
          
            printf "#=================================\n# 🖥 Developed by: v0ltax\n# 🎯 This repository does NOT host any content.\n# 🔗 M3U8: https://github.com/abusaeeidx/IPTV-Scraper-Zilla\n# 🔗 EPG: https://github.com/matthuisman/i.mjh.nz\n# 🕒 Last Updated: %s\n#==================================\n" "$FECHA" > header_temp.txt
          
            cat header_temp.txt > plutotv_mx.m3u
            cat "sync-m3u/plutotv_mx.m3u" >> plutotv_mx.m3u
            
            rm header_temp.txt
          else
            echo "⚠️ No se encontró sync-m3u/plutotv_mx.m3u."
          fi

      # ==========================================
      # 3. PROCESAR PLUTO US -> RAÍZ
      # ==========================================
      - name: Editar plutotv_us + header
        run: |
          if [ -f "sync-m3u/plutotv_us.m3u" ]; then
            echo "Archivo plutotv_us encontrado. Procesando..."
            
            FECHA=$(date +"%Y-%m-%d %H:%M:%S")
          
            printf "#=================================\n# 🖥 Developed by: v0ltax\n# 🎯 This repository does NOT host any content.\n# 🔗 M3U8: https://github.com/abusaeeidx/IPTV-Scraper-Zilla\n# 🔗 EPG: https://github.com/matthuisman/i.mjh.nz\n# 🕒 Last Updated: %s\n#==================================\n" "$FECHA" > header_temp.txt
          
            cat header_temp.txt > plutotv_us.m3u
            cat "sync-m3u/plutotv_us.m3u" >> plutotv_us.m3u
            
            rm header_temp.txt
          else
            echo "⚠️ No se encontró sync-m3u/plutotv_us.m3u."
          fi

      # ==========================================
      # COMMIT Y PUSH EN LA RAÍZ
      # ==========================================
      - name: Commit y Push
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          
          # Agregamos los tres archivos creados en la raíz
          git add plutotv_all.m3u plutotv_mx.m3u plutotv_us.m3u
          
          # Commit si cambió algo
          git diff --cached --quiet || (git commit -m "Update: Pluto TV lists en la raíz con fecha" && git push)