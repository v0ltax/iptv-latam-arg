name: 3. Process PlutoTV

on:
  schedule:
    - cron: "0 */6 * * *" # Cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      # Asegurar que la carpeta content exista en la raíz
      - name: Crear carpeta content si no existe
        run: mkdir -p content

      # ==========================================
      # 1. PROCESAR PLUTO ALL -> CONTENT
      # ==========================================
      - name: Editar plutotv_all + header
        run: |
          if [ -f "sync-m3u/plutotv_all.m3u" ]; then
            echo "Archivo plutotv_all encontrado. Procesando..."
            
            # Fecha actual
            FECHA=$(date +"%Y-%m-%d %H:%M:%S")
          
            # Armar el Header de forma segura sin EOF
            printf "#=================================\n# 🖥 Developed by: v0ltax\n# 🎯 This repository does NOT host any content.\n# 🔗 M3U8: https://github.com/abusaeeidx/IPTV-Scraper-Zilla\n# 🔗 EPG: https://github.com/matthuisman/i.mjh.nz\n# 🕒 Last Updated: %s\n#==================================\n" "$FECHA" > header_temp.txt
          
            # Pegar Header + Contenido Completo del original
            cat header_temp.txt > content/plutotv_all.m3u
            cat "sync-m3u/plutotv_all.m3u" >> content/plutotv_all.m3u
            
            # Limpiar temporal
            rm header_temp.txt
          else
            echo "⚠️ No se encontró sync-m3u/plutotv_all.m3u."
          fi

      # ==========================================
      # 2. PROCESAR PLUTO MX -> CONTENT
      # ==========================================
      - name: Editar plutotv_mx + header
        run: |
          if [ -f "sync-m3u/plutotv_mx.m3u" ]; then
            echo "Archivo plutotv_mx encontrado. Procesando..."
            
            FECHA=$(date +"%Y-%m-%d %H:%M:%S")
          
            printf "#=================================\n# 🖥 Developed by: v0ltax\n# 🎯 This repository does NOT host any content.\n# 🔗 M3U8: https://github.com/abusaeeidx/IPTV-Scraper-Zilla\n# 🔗 EPG: https://github.com/matthuisman/i.mjh.nz\n# 🕒 Last Updated: %s\n#==================================\n" "$FECHA" > header_temp.txt
          
            cat header_temp.txt > content/plutotv_mx.m3u
            cat "sync-m3u/plutotv_mx.m3u" >> content/plutotv_mx.m3u
            
            rm header_temp.txt
          else
            echo "⚠️ No se encontró sync-m3u/plutotv_mx.m3u."
          fi

      # ==========================================
      # 3. PROCESAR PLUTO US -> CONTENT
      # ==========================================
      - name: Editar plutotv_us + header
        run: |
          if [ -f "sync-m3u/plutotv_us.m3u" ]; then
            echo "Archivo plutotv_us encontrado. Procesando..."
            
            FECHA=$(date +"%Y-%m-%d %H:%M:%S")
          
            printf "#=================================\n# 🖥 Developed by: v0ltax\n# 🎯 This repository does NOT host any content.\n# 🔗 M3U8: https://github.com/abusaeeidx/IPTV-Scraper-Zilla\n# 🔗 EPG: https://github.com/matthuisman/i.mjh.nz\n# 🕒 Last Updated: %s\n#==================================\n" "$FECHA" > header_temp.txt
          
            cat header_temp.txt > content/plutotv_us.m3u
            cat "sync-m3u/plutotv_us.m3u" >> content/plutotv_us.m3u
            
            rm header_temp.txt
          else
            echo "⚠️ No se encontró sync-m3u/plutotv_us.m3u."
          fi

      # ==========================================
      # COMMIT Y PUSH DE LA CARPETA CONTENT
      # ==========================================
      - name: Commit y Push
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          
          # Agregamos los cambios de la carpeta content
          git add content/
          
          # Commit si cambió algo
          git diff --cached --quiet || (git commit -m "Update: Pluto TV lists en content con fecha" && git push)