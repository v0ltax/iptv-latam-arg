name: 3. Process Pluto World

on:
  schedule:
    - cron: "0 */6 * * *" # Cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Editar PlutoTV + header
        run: |
          # Chequeamos si el archivo existe en la carpeta sync-m3u
          if [ -f "sync-m3u/PlutoTV-All.m3u" ]; then
            echo "Archivo encontrado. Procesando..."
            
            # 1. Fecha actual
            FECHA=$(date +"%Y-%m-%d %H:%M:%S")

            # 2. Armar el Header con EOF (respetando tu bloque original)
            cat <<EOF > header_temp.txt
          #=================================
          # 🖥 Developed by: v0ltax
          # 🎯 This repository does NOT host any content.
          # 🔗 M3U8: https://github.com/abusaeeidx/IPTV-Scraper-Zilla
          # 🔗 EPG: https://github.com/matthuisman/i.mjh.nz
          # 🕒 Last Updated: $FECHA
          #==================================
          #EXTM3U url-tvg="https://raw.github.com/matthuisman/i.mjh.nz/master/PlutoTV/all.xml.gz"
          #==================================
          EOF

            # 3. Procesar todo en archivos temporales primero
            cat header_temp.txt > temp_final.m3u
            tail -n +12 "sync-m3u/PlutoTV-All.m3u" >> temp_final.m3u
            
            # 4. AL FINAL DE TODO: Mover a la raíz con el nombre definitivo
            mv temp_final.m3u ./plutotv_all.m3u
            
            # Limpiar el header temporal
            rm header_temp.txt
            echo "✓ Todo listo. Archivo enviado a la raíz como plutotv_all.m3u"
            
          else
            echo "⚠️ No se encontró sync-m3u/PlutoTV-All.m3u. Quizás falló la descarga anterior."
            exit 0
          fi

      - name: Commit y Push
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          
          # Agregamos el archivo con su nombre en la raíz
          git add plutotv_all.m3u
          
          # Commit si cambió algo
          git diff --cached --quiet || (git commit -m "Update: Pluto All m3u + epg" && git push)