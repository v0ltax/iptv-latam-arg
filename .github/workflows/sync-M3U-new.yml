name: 1. Sync M3U Files

on:
  schedule:
    - cron: "0 */12 * * *" # Cada 12 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Bajar archivos a sync-m3u
        run: |
          # 1. Creamos la carpeta limpia
          mkdir -p sync-m3u
          
          # ==========================================
          # REPO 1: IPTV-Scraper-Zilla
          # ==========================================
          echo "Buscando archivos m3u/m3u8 en Repo 1..."
          curl -s https://api.github.com/repos/abusaeeidx/IPTV-Scraper-Zilla/contents \
          | jq -r '.[] | select(.name | test("\\.(m3u8?)$")) | .download_url' > urls.txt
          
          while read -r url; do
            [ -z "$url" ] && continue
            filename=$(basename "$url")
            curl -L -s -o "sync-m3u/$filename" "$url"
          done < urls.txt
          
          rm -f urls.txt

          # ==========================================
          # REPO 2: BuddyChewChew (Carpeta playlists)
          # ==========================================
          echo "Buscando archivos m3u/m3u8 en Repo 2..."
          curl -s https://api.github.com/repos/BuddyChewChew/app-m3u-generator/contents/playlists \
          | jq -r '.[] | select(.name | test("\\.(m3u8?)$")) | .download_url' > urls.txt
          
          while read -r url; do
            [ -z "$url" ] && continue
            filename=$(basename "$url")
            curl -L -s -o "sync-m3u/$filename" "$url"
          done < urls.txt
          
          rm -f urls.txt

      - name: Commit y Push
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          
          # Agregamos solo la carpeta de descarga
          git add sync-m3u/
          
          # Commit solo si hay cambios
          git diff --cached --quiet || (git commit -m "Sync: Descarga de listas m3u" && git push)